name: Mobile release

# Signs the app as it is on main (web/ included) and uploads it to App Store Connect; the
# internal testing group's automatic distribution then sends it to the owner's iPhone.
# Run by hand after importing a new web build, or from Mobile refresh before a build expires.
on:
  workflow_dispatch:
    inputs:
      production_checked:
        description: >-
          Tick only if the check below cannot reach the site (Cloudflare can block GitHub
          runners) and you confirmed https://invest.oraclelee.com serves this app's origin
        type: boolean
        default: false
  workflow_call:
    inputs:
      production_checked:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  API_ORIGIN: https://invest.oraclelee.com
  APP_ORIGIN: capacitor://localhost

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      ios: ${{ steps.signing.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version and build number
        run: |
          set -euo pipefail
          [ -f web/BUILD.json ] || { echo "::error::web/BUILD.json is missing; import the web first"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          # A UTC timestamp, not the run number: Mobile refresh calls this workflow too, and
          # each workflow numbers its own runs, so run numbers could repeat across the two.
          build="$(date -u +%Y%m%d%H%M)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "App ${version} (${build}) with the web of $(jq -r .commit web/BUILD.json)." >> "${GITHUB_STEP_SUMMARY}"
      # The app can read nothing unless the production backend answers its origin with CORS.
      - name: Check production serves the app's origin
        env:
          PRODUCTION_CHECKED: ${{ inputs.production_checked }}
        run: |
          set -euo pipefail
          allowed="$(curl --silent --show-error --max-time 20 --output /dev/null --dump-header - \
            -H "Origin: ${APP_ORIGIN}" "${API_ORIGIN}/api/reports" \
            | tr -d '\r' | sed -n 's/^access-control-allow-origin: //Ip' | head -n 1)" || allowed=""
          if [ "${allowed}" = "${APP_ORIGIN}" ]; then
            echo "Production allows ${APP_ORIGIN}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${PRODUCTION_CHECKED}" != true ]; then
            echo "::error::${API_ORIGIN} did not answer ${APP_ORIGIN} with CORS from this runner (got '${allowed}'). If Cloudflare blocked the runner, check it yourself (curl -sI -H 'Origin: ${APP_ORIGIN}' ${API_ORIGIN}/api/reports) and run again with production_checked ticked."
            exit 1
          fi
          echo "::warning::production CORS not checked automatically; production_checked was ticked"
          echo "Production CORS confirmed by hand, not by this run." >> "${GITHUB_STEP_SUMMARY}"
      - id: signing
        name: Check the signing secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_P12_PASSWORD IOS_PROFILE_BASE64 \
            APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing="${missing} ${name}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::missing secrets:${missing}; run scripts/ios-signing.sh secrets"
            exit 1
          fi
          echo "ios=true" >> "${GITHUB_OUTPUT}"

  # TODO when the approved frontend lands: an XCUITest smoke on the simulator before the
  # upload (report list, open a report, a source link opens Safari, offline notice).

  ios:
    needs: preflight
    if: needs.preflight.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:capacitor
      - run: npx cap sync ios
      - name: Install the distribution certificate and the App Store profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "${IOS_DIST_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/distribution.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/distribution.p12" -P "${IOS_DIST_CERT_P12_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          # macOS runners ship bash 3.2 (no mapfile), so collect the search list line by line.
          keychains=("${keychain}")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            keychains+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          rm "${RUNNER_TEMP}/distribution.p12"
          echo "KEYCHAIN_PATH=${keychain}" >> "${GITHUB_ENV}"

          profile="${RUNNER_TEMP}/profile.mobileprovision"
          printf '%s' "${IOS_PROFILE_BASE64}" | base64 --decode > "${profile}"
          security cms -D -i "${profile}" > "${RUNNER_TEMP}/profile.plist"
          name="$(plutil -extract Name raw -o - "${RUNNER_TEMP}/profile.plist")"
          uuid="$(plutil -extract UUID raw -o - "${RUNNER_TEMP}/profile.plist")"
          if [ "${name}" != "Invest App Store" ]; then
            echo "::error::the provisioning profile is named '${name}', expected 'Invest App Store'"
            exit 1
          fi
          for dir in "${HOME}/Library/MobileDevice/Provisioning Profiles" \
            "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "${dir}"
            cp "${profile}" "${dir}/${uuid}.mobileprovision"
          done

          printf '%s' "${ASC_API_KEY_P8_BASE64}" | base64 --decode > "${RUNNER_TEMP}/AuthKey_${ASC_API_KEY_ID}.p8"
      - name: Archive and upload to App Store Connect (TestFlight)
        working-directory: ios/App
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -version
          # Signing lives in the App target's Release settings; passing it here would
          # also apply it to the Swift packages, which cannot take a profile.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            MARKETING_VERSION="${VERSION}" CURRENT_PROJECT_VERSION="${BUILD}" \
            INVEST_APPLE_TEAM_ID="${APPLE_TEAM_ID}" archive
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.oraclelee.invest</key><string>Invest App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" -exportPath "${RUNNER_TEMP}/export" \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_API_KEY_ID}" -authenticationKeyIssuerID "${ASC_API_ISSUER_ID}"
          echo "- iOS: build ${VERSION} (${BUILD}) uploaded; TestFlight sends it to the internal group after processing" >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove the signing material
        if: always()
        run: |
          [ -z "${KEYCHAIN_PATH:-}" ] || security delete-keychain "${KEYCHAIN_PATH}" || true
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8 "${RUNNER_TEMP}/profile.mobileprovision"
